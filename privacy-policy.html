<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Privacy policies for games published by Small&Simple.">
  <meta name="color-scheme" content="light">
  <title>Game Privacy Policies — Small&amp;Simple</title>
  <style>
    :root { --ink:#20252b; --muted:#5f6b76; --line:#e3e8ec; --accent:#286b5b; --paper:#fff; --wash:#f3f7f5; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--wash); color:var(--ink); font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(760px,calc(100% - 32px)); margin:56px auto; }
    .card { background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:clamp(26px,6vw,52px); box-shadow:0 12px 38px #20352c0b; }
    a { color:var(--accent); text-underline-offset:3px; }
    .brand { color:var(--accent); font-size:.78rem; font-weight:750; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:8px 0; font-size:clamp(2rem,7vw,3rem); line-height:1.15; letter-spacing:-.04em; }
    .intro { margin:0 0 28px; color:var(--muted); }
    .game { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:20px 0; border-top:1px solid var(--line); }
    .game h2 { margin:0 0 3px; font-size:1.15rem; }
    .game p { margin:0; color:var(--muted); font-size:.93rem; }
    .button { flex:0 0 auto; display:inline-block; padding:9px 14px; border-radius:9px; background:var(--accent); color:#fff; font-weight:700; text-decoration:none; }
    .button:hover { background:#205849; }
    .back { display:inline-block; margin-top:26px; }
    @media(max-width:520px) { main { margin:20px auto; } .game { align-items:flex-start; flex-direction:column; gap:12px; } }
  </style>
</head>
<body>
  <main><article class="card">
    <div class="brand">Small&amp;Simple</div>
    <h1>Privacy policies</h1>
    <p class="intro">Choose a game to read its privacy policy. Each policy describes the information practices for that game.</p>
    <section class="game"><div><h2>ChromaFlash</h2></div><a class="button" href="privacy/chromaflash.html">View policy <span aria-hidden="true">→</span></a></section>
    <section class="game"><div><h2>Blocks: 3D</h2></div><a class="button" href="privacy/blocks-3d.html">View policy <span aria-hidden="true">→</span></a></section>
    <a class="back" href="index.html">← Small&amp;Simple home</a>
  </article></main>
</body>
</html>
